# Splay for iPhone — the utility layer. See docs/plans/splay-ios-utility-layer.md.
#
# Two targets:
#   Splay        the app process: SplayCore (capture, STT, storage), the recording
#                coordinator, the App Intents' actual work, and a findable-only
#                Recents list. It is never the surface; the island is.
#   SplayWidgets the WidgetKit extension: the Live Activity (Dynamic Island + Lock
#                Screen) and the Control Center control the Action Button drives.
#
# Generate with `xcodegen generate` (brew install xcodegen); the .xcodeproj is
# git-ignored. scripts/dev/install_iphone.sh does generate → build → install → launch.
name: Splay
options:
  bundleIdPrefix: com.macparakeet.mc
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  SplayPackage:
    path: ../..
settings:
  base:
    DEVELOPMENT_TEAM: 76K8473JHR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Splay:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # Bundled speech models (docs/plans/splay-ios-utility-layer.md § Model
      # delivery): a folder reference copied verbatim into Splay.app/Models/,
      # laid out like FluidAudio's cache. scripts/dev/install_iphone.sh stages
      # it from the Mac's cache; it is git-ignored and optional so a CI build
      # without it still compiles (the app then downloads on first launch).
      - path: Resources/Models
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: SplayPackage
        product: SplayCore
      - target: SplayWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Splay
        UILaunchScreen: {}
        # iPhone only, full screen: silences the all-orientations requirement.
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: Splay records only when you press the Action Button or its control. Audio never leaves this phone.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        # Transcripts and paired audio live in Documents so the Files app can show them.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macparakeet.mc.ios
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SPLAY_APP $(inherited)
  SplayWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Splay
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macparakeet.mc.ios.widgets
